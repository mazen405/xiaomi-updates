name: build-apk

# يبني ملف APK بالبيانات المضمّنة (للعمل بدون إنترنت). شغّله يدوياً بعد backfill-history.

on:
  workflow_dispatch:
  push:
    paths:
      - "www/**"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/build.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check data exists
        run: |
          test -f data/index.json && test -f data/index.sig || { echo "::error::لا توجد بيانات بعد. شغّل backfill-history أولاً."; exit 1; }
          rm -rf www/data && cp -r data www/data
          echo "bundled devices: $(ls www/data/devices | wc -l)"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm install

      - name: Add Android
        run: npx cap add android

      - name: Harden manifest (no backups, no cleartext traffic)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' "$f"
          grep -q usesCleartextTraffic "$f" || sed -i 's/<application/<application android:usesCleartextTraffic="false"/' "$f"
          grep -n "allowBackup\|usesCleartextTraffic" "$f"

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: xiaomi-updates-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
