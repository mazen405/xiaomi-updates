name: collect-updates

# يجلب كل 10 دقائق آخر بيانات التحديثات من المشروع المفتوح
# XiaomiFirmwareUpdater/miui-updates-tracker، ويقرأ قناته على تلجرام (المسار السريع)،
# ثم يضيف الجديد إلى السجل ويوقّع الفهرس رقمياً.
# السجل تراكمي: لا يُحذف أي إصدار سبق ظهوره.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch source data
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/XiaomiFirmwareUpdater/miui-updates-tracker src
          git -C src sparse-checkout set --no-cone /data/ /rss/latest.xml

      - name: Build data
        env:
          DATA_SIGNING_KEY: ${{ secrets.DATA_SIGNING_KEY }}
        run: python build_data.py --src src --out data --telegram --require-sign

      - name: Commit data
        run: |
          git config user.name "updates-bot"
          git config user.email "updates-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no new updates"
          else
            git commit -m "data: new releases $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -q
            git push
          fi
