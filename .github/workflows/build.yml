name: build-apk

# يبني ملف APK بالبيانات المضمّنة (للعمل بدون إنترنت). شغّله يدوياً بعد backfill-history.

on:
  workflow_dispatch:
  push:
    paths:
      - "www/**"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/build.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check data exists
        run: |
          test -f data/index.json && test -f data/index.sig || { echo "::error::لا توجد بيانات بعد. شغّل backfill-history أولاً."; exit 1; }
          rm -rf www/data && cp -r data www/data
          echo "bundled devices: $(ls www/data/devices | wc -l)"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm install

      - name: Add Android
        run: npx cap add android

      - name: Harden manifest (no backups, no cleartext traffic)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' "$f"
          grep -q usesCleartextTraffic "$f" || sed -i 's/<application/<application android:usesCleartextTraffic="false"/' "$f"
          grep -n "allowBackup\|usesCleartextTraffic" "$f"

      - name: Edge-to-edge (status bar, navigation bar, window background)
        run: |
          pkg=com.mazen.xiaomiupdates
          dir=android/app/src/main/java/com/mazen/xiaomiupdates
          mkdir -p "$dir"
          cat > "$dir/MainActivity.java" <<'JAVA'
          package com.mazen.xiaomiupdates;

          import android.os.Bundle;
          import androidx.activity.OnBackPressedCallback;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private volatile int top = 0, bottom = 0;
              private OnBackPressedCallback backCb;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  final float d = getResources().getDisplayMetrics().density;
                  final WebView wv = getBridge().getWebView();
                  wv.addJavascriptInterface(new Object() {
                      @JavascriptInterface public int top() { return Math.round(top / d); }
                      @JavascriptInterface public int bottom() { return Math.round(bottom / d); }
                      @JavascriptInterface public void light(final boolean l) {
                          runOnUiThread(new Runnable() { public void run() {
                              WindowInsetsControllerCompat c = new WindowInsetsControllerCompat(getWindow(), getWindow().getDecorView());
                              c.setAppearanceLightStatusBars(l);
                              c.setAppearanceLightNavigationBars(l);
                          }});
                      }
                  }, "EhapInsets");
                  View root = getWindow().getDecorView();
                  ViewCompat.setOnApplyWindowInsetsListener(root, (v, ins) -> {
                      Insets bars = ins.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout());
                      Insets ime = ins.getInsets(WindowInsetsCompat.Type.ime());
                      top = bars.top;
                      bottom = Math.max(bars.bottom, ime.bottom);
                      wv.post(new Runnable() { public void run() {
                          wv.evaluateJavascript("window.dispatchEvent(new Event('resize'))", null);
                      }});
                      return ViewCompat.onApplyWindowInsets(v, ins);
                  });
                  backCb = new OnBackPressedCallback(true) {
                      @Override public void handleOnBackPressed() {
                          wv.evaluateJavascript("(function(){try{return window.__ehapBack?window.__ehapBack():false}catch(e){return false}})()", value -> {
                              if (!"true".equals(value)) {
                                  setEnabled(false);
                                  getOnBackPressedDispatcher().onBackPressed();
                              }
                          });
                      }
                  };
                  getOnBackPressedDispatcher().addCallback(this, backCb);
              }

              @Override
              public void onResume() {
                  super.onResume();
                  if (backCb != null) backCb.setEnabled(true);
              }
          }
          JAVA
          cat > android/app/src/main/res/values/ehap.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ehap_bg">#070f13</color>
          </resources>
          XML
          python3 - <<'PY'
          import re
          f = "android/app/src/main/res/values/styles.xml"
          s = open(f, encoding="utf-8").read()
          items = """
                  <item name="android:windowBackground">@color/ehap_bg</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="android:enforceNavigationBarContrast">false</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
          """
          def add(name, extra):
              global s
              m = re.search(r'(<style name="%s"[^>]*>)' % re.escape(name), s)
              if m:
                  s = s[:m.end()] + extra + s[m.end():]
          add("AppTheme.NoActionBar", items)
          add("AppTheme.NoActionBarLaunch", '\n        <item name="android:windowBackground">@color/ehap_bg</item>')
          open(f, "w", encoding="utf-8").write(s)
          print(s)
          PY

      - name: Sync
        run: npx cap sync android

      - name: Stable signing key (so every build updates over the previous one)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::warning::DEBUG_KEYSTORE_B64 secret missing - build is signed with a random key"
            exit 0
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/ehap.keystore"
          mkdir -p ~/.android && cp "$RUNNER_TEMP/ehap.keystore" ~/.android/debug.keystore
          cat >> android/app/build.gradle <<GRADLE

          android {
              signingConfigs {
                  debug {
                      storeFile file("$RUNNER_TEMP/ehap.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                      storeType "pkcs12"
                  }
              }
          }
          GRADLE
          echo "stable key installed"
          tail -n 14 android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Show signing fingerprint (must stay identical in every build)
        run: |
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -E "Owner|SHA256"

      - uses: actions/upload-artifact@v4
        with:
          name: xiaomi-updates-apk
          retention-days: 14
          path: android/app/build/outputs/apk/debug/app-debug.apk
