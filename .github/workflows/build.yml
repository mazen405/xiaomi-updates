name: backfill-history

# يُشغَّل يدوياً مرة واحدة فقط (يستغرق نحو دقيقتين):
# يبني السجل الكامل لكل الأجهزة من تاريخ المشروع المفتوح ويوقّع الفهرس.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Full clone of the source project
        run: git clone https://github.com/XiaomiFirmwareUpdater/miui-updates-tracker src

      - name: Rebuild history
        env:
          DATA_SIGNING_KEY: ${{ secrets.DATA_SIGNING_KEY }}
        run: python build_data.py --src src --out data --backfill --require-sign

      - name: Commit data
        run: |
          git config user.name "updates-bot"
          git config user.email "updates-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "data: full history backfill"
            git pull --rebase -q
            git push
          fi
